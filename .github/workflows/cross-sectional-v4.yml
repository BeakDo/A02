name: Cross Sectional Alpha V4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.cross-v4-trigger'

concurrency:
  group: cross-sectional-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  research:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow requests
      - name: Normalize and verify optimized research source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('research/cross_sectional_v4_optimized.py')
          raw=src.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n').encode('utf-8')
          src.write_bytes(raw)
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='c2d3738e256da1b790d41cc39e6282c0436d7a79d37b6e484938af9b25345c54', digest
          print('verified',digest,len(raw))
          PY
          python -m py_compile research/cross_sectional_v4_optimized.py
      - name: Search development and cross-symbol validation
        shell: bash
        run: |
          mkdir -p research/cross_sectional_v4/results
          set -o pipefail
          python research/cross_sectional_v4_optimized.py search 2>&1 | tee research/cross_sectional_v4/results/search.log
      - name: Open fresh holdout once
        shell: bash
        run: |
          set -o pipefail
          python research/cross_sectional_v4_optimized.py holdout 2>&1 | tee research/cross_sectional_v4/results/holdout.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-sectional-v4-optimized-results
          path: |
            research/cross_sectional_v4/results
            research/cross_sectional_v4_optimized.py
          retention-days: 7
          if-no-files-found: warn
