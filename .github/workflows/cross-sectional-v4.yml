name: Cross Sectional Alpha V4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.cross-v4-trigger'

concurrency:
  group: cross-sectional-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  research:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow requests
      - name: Restore and verify research source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts=sorted(Path('research/cross_v4_chunks').glob('part_*'))
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert len(parts)==13, len(parts)
          assert hashlib.sha256(encoded.encode()).hexdigest()=='9fe20b85cebe917203c114afcb597611f4fbc5d9caa06040820e027f480e6c37'
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='7ff87d7db8d0e3a532601449c4a189f9709dd00d904f6d9f66bfbed9a912c703'
          Path('research/cross_sectional_v4.py').write_bytes(raw)
          print('verified',len(raw))
          PY
          python -m py_compile research/cross_sectional_v4.py
      - name: Search development and cross-symbol validation
        shell: bash
        run: |
          mkdir -p research/cross_sectional_v4/results
          set -o pipefail
          python research/cross_sectional_v4.py search 2>&1 | tee research/cross_sectional_v4/results/search.log
      - name: Open fresh holdout once
        shell: bash
        run: |
          set -o pipefail
          python research/cross_sectional_v4.py holdout 2>&1 | tee research/cross_sectional_v4/results/holdout.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-sectional-v4-results
          path: |
            research/cross_sectional_v4/results
            research/cross_sectional_v4.py
          retention-days: 7
          if-no-files-found: warn
