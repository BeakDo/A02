name: Cross Sectional Alpha V4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.cross-v4-trigger'

concurrency:
  group: cross-sectional-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  research:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow requests
      - name: Normalize, patch timestamps, and verify source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('research/cross_sectional_v4_optimized.py')
          raw=src.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n').encode('utf-8')
          assert hashlib.sha256(raw).hexdigest()=='c2d3738e256da1b790d41cc39e6282c0436d7a79d37b6e484938af9b25345c54'
          s=raw.decode('utf-8')
          old1="df['timestamp']=pd.to_datetime(df['open_time'],unit='ms',utc=True,errors='coerce')"
          new1="unit='us' if pd.to_numeric(df['open_time'],errors='coerce').dropna().median()>1e14 else 'ms'\n    df['timestamp']=pd.to_datetime(df['open_time'],unit=unit,utc=True,errors='coerce')"
          old2="ts=pd.to_datetime(df[tcol],unit='ms',utc=True,errors='coerce')"
          new2="tv=pd.to_numeric(df[tcol],errors='coerce')\n    unit='us' if tv.dropna().median()>1e14 else 'ms'\n    ts=pd.to_datetime(tv,unit=unit,utc=True,errors='coerce')"
          assert old1 in s and old2 in s
          patched=s.replace(old1,new1).replace(old2,new2).encode('utf-8')
          assert hashlib.sha256(patched).hexdigest()=='4da762b9ebe71df8bb647c7cbf74067025b7e336eca1f95f8307ef43963df753'
          src.write_bytes(patched)
          print('verified',len(patched))
          PY
          python -m py_compile research/cross_sectional_v4_optimized.py
      - name: Search development and cross-symbol validation
        shell: bash
        run: |
          mkdir -p research/cross_sectional_v4/results
          set -o pipefail
          python research/cross_sectional_v4_optimized.py search 2>&1 | tee research/cross_sectional_v4/results/search.log
      - name: Open fresh holdout once
        shell: bash
        run: |
          set -o pipefail
          python research/cross_sectional_v4_optimized.py holdout 2>&1 | tee research/cross_sectional_v4/results/holdout.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-sectional-v4-optimized-results
          path: |
            research/cross_sectional_v4/results
            research/cross_sectional_v4_optimized.py
          retention-days: 7
          if-no-files-found: warn
