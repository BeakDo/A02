name: Time Series State Alpha V6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.timeseries-v6-trigger'

concurrency:
  group: timeseries-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow requests
      - name: Restore and verify V6 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          parts=sorted(Path('research/timeseries_v6_chunks').glob('part_*'))
          assert len(parts)==10,len(parts)
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert hashlib.sha256(encoded.encode()).hexdigest()=='e30a6545211dfbb22d0d6a18a57057e8b48ebe290e0c168e95b75440659d9845'
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='3c5098dba1547a6d42d58eaff57fe89ecd74aa8d4538b3442e362d269836fd85'
          Path('research/timeseries_v6.py').write_bytes(raw)
          print('verified',len(raw))
          PY
          python -m py_compile research/timeseries_v6.py
      - name: Search development and cross-symbol validation
        shell: bash
        run: |
          mkdir -p research/timeseries_v6/results
          set -o pipefail
          python research/timeseries_v6.py search 2>&1 | tee research/timeseries_v6/results/search.log
      - name: Open fresh holdout once
        shell: bash
        run: |
          set -o pipefail
          python research/timeseries_v6.py holdout 2>&1 | tee research/timeseries_v6/results/holdout.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeseries-v6-results
          path: |
            research/timeseries_v6/results
            research/timeseries_v6.py
          retention-days: 7
          if-no-files-found: warn
