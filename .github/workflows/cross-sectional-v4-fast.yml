name: Cross Sectional Alpha V4 Fast

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.cross-v4-fast-trigger'

concurrency:
  group: cross-sectional-v4-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  research:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow requests
      - name: Restore and patch verified fast research source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          parts=sorted(Path('research/cross_v4_fast_chunks').glob('part_*'))
          assert len(parts)==6,len(parts)
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert hashlib.sha256(encoded.encode()).hexdigest()=='8a62f07d172193c335844a781a382e2f6fac3b73f0ed65cbe7268c496b25e0f3'
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='4cdd92231593392aef3e49f87af89e0ca1482e2e4ecfaaf1d9e1e9e667112d02'
          s=raw.decode('utf-8').replace("f'{BASE_URL}/{symbol}/1h/{symbol}-1h-{ym}.zip'","f'{BASE_URL}/{symbol}/15m/{symbol}-15m-{ym}.zip'")
          patched=s.encode('utf-8')
          assert hashlib.sha256(patched).hexdigest()=='538706974d40f9f0ae0c24716c1a933b688acd69245d83ee96e666e88a1bac0a'
          Path('research/cross_sectional_v4_fast.py').write_bytes(patched)
          print('verified',len(patched))
          PY
          python -m py_compile research/cross_sectional_v4_fast.py
      - name: Search development and validation
        shell: bash
        run: |
          mkdir -p research/cross_sectional_v4/results
          set -o pipefail
          python research/cross_sectional_v4_fast.py search 2>&1 | tee research/cross_sectional_v4/results/search.log
      - name: Open fresh holdout once
        shell: bash
        run: |
          set -o pipefail
          python research/cross_sectional_v4_fast.py holdout 2>&1 | tee research/cross_sectional_v4/results/holdout.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-sectional-v4-fast-results
          path: |
            research/cross_sectional_v4/results
            research/cross_sectional_v4_fast.py
          retention-days: 7
          if-no-files-found: warn
