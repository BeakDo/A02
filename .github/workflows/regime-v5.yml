name: Regime Asymmetric Alpha V5

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.regime-v5-trigger'

concurrency:
  group: regime-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow requests
      - name: Restore and verify V5 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          parts=sorted(Path('research/regime_v5_chunks').glob('part_*'))
          assert len(parts)==11,len(parts)
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert hashlib.sha256(encoded.encode()).hexdigest()=='f0962cf4c3559f2f0a50326082d901992054a5164891659f0d39e1e9d12d6e29'
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='ac2872d9ad29e503f7c650e68a1b9a6a2a4ca8076ef8efaae70adb53f23712b5'
          Path('research/regime_v5.py').write_bytes(raw)
          print('verified',len(raw))
          PY
          python -m py_compile research/regime_v5.py
      - name: Search development and cross-symbol validation
        shell: bash
        run: |
          mkdir -p research/regime_v5/results
          set -o pipefail
          python research/regime_v5.py search 2>&1 | tee research/regime_v5/results/search.log
      - name: Open fresh holdout once
        shell: bash
        run: |
          set -o pipefail
          python research/regime_v5.py holdout 2>&1 | tee research/regime_v5/results/holdout.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regime-v5-results
          path: |
            research/regime_v5/results
            research/regime_v5.py
          retention-days: 7
          if-no-files-found: warn
