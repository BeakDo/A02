name: Sealed Burst Convexity V3 Windows

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.burst-win-trigger'

concurrency:
  group: sealed-burst-v3-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  research:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: python -m pip install --upgrade pip pandas numpy pyarrow requests
      - name: Restore and verify source
        shell: bash
        run: |
          cat research/burst_chunks_v3/part_* > burst.py.gz.b64
          echo '5b7e41e52ce1b9344f10d8799d06679301861781a0b41d3228c4de0234e93f39  burst.py.gz.b64' | sha256sum -c -
          base64 -d burst.py.gz.b64 | gzip -d > research/burst_research.py
          echo 'a249c82623c94134b008f04bbe08330b5a7d286de61e0bd72ab3c7927b7d7446  research/burst_research.py' | sha256sum -c -
          echo '54acb80d9d9fc7188f9a2da75d36e5f21eb494529bfb89466ee65392d9883343  research/patch_burst_memory.py' | sha256sum -c -
          python research/patch_burst_memory.py
          echo 'b93954b3d1dde1e42b1e970a5643652b1ff6badb0787d236c0cce45fc410b377  research/burst_research.py' | sha256sum -c -
          python -m py_compile research/burst_research.py
      - name: Search pre-holdout and freeze candidate
        shell: bash
        run: |
          mkdir -p research/burst_convexity/results
          set -o pipefail
          python research/burst_research.py search 2>&1 | tee research/burst_convexity/results/search.log
      - name: Open holdout once
        shell: bash
        run: |
          set -o pipefail
          python research/burst_research.py holdout 2>&1 | tee research/burst_convexity/results/holdout.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-burst-v3-windows-results
          path: |
            research/burst_convexity/results
            research/burst_research.py
          retention-days: 7
          if-no-files-found: warn
