name: Binance Data Probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.binance-probe-trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pandas pyarrow
      - name: Probe exact downloader path
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee binance-probe.log
          import io, zipfile, requests, pandas as pd, traceback
          from pathlib import Path

          BASE='https://data.binance.vision/data/futures/um/monthly/klines'
          FUND='https://data.binance.vision/data/futures/um/monthly/fundingRate'
          s=requests.Session(); s.headers['User-Agent']='binance-data-probe/1.0'

          def get(url):
              for i in range(4):
                  try:
                      r=s.get(url,timeout=45)
                      print('GET',r.status_code,len(r.content),url)
                      if r.status_code==200:return r.content
                      if r.status_code in (403,404):return None
                  except Exception as e:
                      print('GETERR',repr(e),url)
              return None

          def parse_kline(raw):
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  df=pd.read_csv(z.open(z.namelist()[0]),header=None,usecols=list(range(12)))
              df.columns=['open_time','open','high','low','close','volume','close_time','quote_volume','trades','taker_buy_base','taker_buy_quote','ignore']
              for c in ['open','high','low','close','quote_volume','taker_buy_quote']:
                  df[c]=pd.to_numeric(df[c],errors='coerce')
              tv=pd.to_numeric(df['open_time'],errors='coerce')
              unit='us' if tv.dropna().median()>1e14 else 'ms'
              df['timestamp']=pd.to_datetime(tv,unit=unit,utc=True,errors='coerce')
              out=df[['timestamp','open','high','low','close','quote_volume','taker_buy_quote']].dropna(subset=['timestamp']).drop_duplicates('timestamp')
              print('PARSED',len(out),out.timestamp.min(),out.timestamp.max(),unit)
              return out

          def exact_download(symbol, interval='1h'):
              frames=[]
              for ym in ['2023-01','2023-02','2023-03']:
                  url=f'{BASE}/{symbol}/{interval}/{symbol}-{interval}-{ym}.zip'
                  raw=get(url)
                  if raw:
                      try: frames.append(parse_kline(raw))
                      except Exception:
                          print('PARSEFAIL',symbol,ym); traceback.print_exc()
              print('FRAMECOUNT',symbol,interval,len(frames))
              if not frames:return
              d=pd.concat(frames,ignore_index=True).sort_values('timestamp').drop_duplicates('timestamp').set_index('timestamp')
              if interval=='15m':
                  d=d.resample('1h').agg({'open':'first','high':'max','low':'min','close':'last','quote_volume':'sum','taker_buy_quote':'sum'})
              d['funding']=0.0; d['funding_available']=False
              print('COMBINED',symbol,len(d),d.index.min(),d.index.max(),d.dtypes.to_dict())
              out=Path(f'{symbol}_{interval}.parquet')
              d.astype({c:'float32' for c in ['open','high','low','close','quote_volume','taker_buy_quote','funding']}).to_parquet(out)
              reread=pd.read_parquet(out)
              print('PARQUET_OK',symbol,interval,len(reread),reread.index.min(),reread.index.max())

          for sym in ['BTCUSDT','FETUSDT','ANKRUSDT']:
              try: exact_download(sym,'1h')
              except Exception:
                  print('EXACT_FAIL',sym,'1h'); traceback.print_exc()
              try: exact_download(sym,'15m')
              except Exception:
                  print('EXACT_FAIL',sym,'15m'); traceback.print_exc()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-data-probe
          path: binance-probe.log
          retention-days: 3
